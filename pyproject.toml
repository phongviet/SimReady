[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "simready"
version = "0.0.1"
description = "Local RGB-D reconstruction and scene editing studio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "scipy==1.18.1",
    "scikit-image==0.26.0",
]

[project.scripts]
simready = "simready.cli:main"

[project.optional-dependencies]
research = [
    "matplotlib==3.11.2",
]
geometry = [
    "open3d-cpu==0.19.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dash"
markers = ["official_data: requires the official synthetic Open3D sample", "real_data: requires the real TUM RGB-D sequence", "gpu: requires the isolated gsplat CUDA worker", "geometry: requires optional Open3D CPU TSDF dependencies"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
exclude = ["*.md"]
