[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "simready"
version = "0.0.1"
description = "M0: canonical RGB-D contracts and mathematical sanity checks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.2,<3", "pillow>=11,<13", "pydantic>=2.10,<3"]

[project.scripts]
simready = "simready.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: requires the separately downloaded official sample", "gpu: requires the isolated gsplat CUDA worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
exclude = ["*.md"]
