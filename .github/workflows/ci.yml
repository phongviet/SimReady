name: M0 acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  npm_config_cache: ${{ github.workspace }}/frontend/.npm-cache
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.2'
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check src tests scripts workers
      - run: uv run --frozen pytest -q -m 'not real_data and not gpu'
      - run: make demo storage
  official-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.2'
          enable-cache: false
      - run: uv sync --frozen
      - run: make test-real storage
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: make storage
